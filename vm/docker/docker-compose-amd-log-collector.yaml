services:
  crusoe-amd-log-collector:
    image: ${IMAGE_REGISTRY_GHCR:-ghcr.io}/crusoecloud/crusoe-watch-agent/amd-log-collector:${LOG_COLLECTOR_IMAGE_VERSION}
    container_name: crusoe-amd-log-collector
    hostname: crusoe-amd-log-collector

    volumes:
      # Persistent log storage on host
      - /var/log/amd-bug-reports:/logs
      # DMI information for VM ID detection
      - /sys:/host/sys:ro
      # Host install/config state for rocm_techsupport.sh (read-only).
      - /var/lib/dpkg:/var/lib/dpkg:ro        # dpkg -l  -> host amdgpu-dkms / ROCm packages
      - /lib/modules:/lib/modules:ro          # modinfo amdgpu
      - /var/lib/dkms:/var/lib/dkms:ro         # dkms status
      - /boot:/boot:ro                         # lsinitramfs
      - /var/log/journal:/var/log/journal:ro   # journalctl -b -1/-2/-3 (needs host persistent journald)

    # ROCm device access
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri

    env_file:
      - ./.env
      - /etc/crusoe/secrets/.monitoring-token

    environment:
      - GPU_TYPE=amd
      - API_ENABLED=true

    privileged: true
    restart: always
